  effect: 4.1.4
  '@effect/platform-node': 4.1.4
  '@effect/sql-pg': 4.1.4
  '@effect/sql-pglite': 4.1.4
  '@effect/vitest': 4.1.4
  '@effect/language-service': 0.87.5
  # Data
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5
  '@electric-sql/pglite': 0.5.16
  # Domain
  alchemy: 2.0.0-beta.87
  '@alchemy.run/domain': 2.0.0-beta.87
  xstate: 5.33.4
  # Auth
  openid-client: 6.9.0
  # Web
  react: 19.3.1
  react-dom: 19.3.1
