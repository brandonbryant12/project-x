# Declarative Jenkins Pipeline YAML template for downstream forks.
# Adapt `agent`, `registry`, `namespace`, and Vault/kube credential IDs to match
# your organization's internal Jenkins platform (Pipeline-as-YAML / shared lib).
#
# Application secrets MUST stay in Vault (see ../helm/README.md) and are never
# passed via `--set` on the Helm CLI.

apiVersion: jenkins.coaching-catalyst/v1
kind: PipelineTemplate
metadata:
  name: coaching-catalyst
  description: CI quality gates, formal verification, OCI build, and Helm rollout

agent:
  label: 'linux && node24 && docker && helm'

options:
  timestamps: true
  disableConcurrentBuilds: true
  timeoutMinutes: 45
  buildDiscarder:
    numToKeep: 60
    artifactNumToKeep: 20

environment:
  CI: 'true'
  NODE_VERSION: '24'
  HELM_CHART_PATH: 'helm/coaching-catalyst'
  # Override in downstream fork:
  IMAGE_REPOSITORY: 'ghcr.io/your-org/coaching-catalyst'
  STAGING_NAMESPACE: 'coaching-catalyst-staging'
  PROD_NAMESPACE: 'coaching-catalyst-prod'
  HELM_RELEASE_NAME: 'coaching-catalyst'

credentials:
  # Only bound on main/CD runs — never exposed to PR builds.
  registryPush: 'container-registry-credentials'
  kubeconfigStaging: 'kubeconfig-staging'
  kubeconfigProd: 'kubeconfig-prod'

stages:
  - name: Checkout
    steps:
      - checkout: scm

  - name: Setup Toolchain
    steps:
      - sh: |
          npm install --global --no-fund --no-audit "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          node --version
          pnpm --version

  - name: Install Dependencies
    steps:
      - sh: pnpm install --frozen-lockfile

  - name: Quality Gates & Formal Verification
    description: Format, strict lint, tsc7, @alchemy.run/domain formal proofs, PGlite tests, knip, docs & diagram drift
    steps:
      - sh: pnpm check

  - name: Real Postgres 18 Suite (Optional)
    when:
      envSet: TEST_DATABASE_URL
    steps:
      - sh: pnpm test:pg

  - name: Build Artifacts
    steps:
      - sh: pnpm build

  - name: Validate Helm Chart
    steps:
      - sh: |
          helm lint "${HELM_CHART_PATH}"
          helm lint "${HELM_CHART_PATH}" -f "${HELM_CHART_PATH}/values-staging.yaml"
          helm lint "${HELM_CHART_PATH}" -f "${HELM_CHART_PATH}/values-prod.yaml"
          helm template "${HELM_RELEASE_NAME}" "${HELM_CHART_PATH}" \
            -f "${HELM_CHART_PATH}/values-prod.yaml" \
            --set "image.repository=${IMAGE_REPOSITORY}" \
            --set "image.tag=sha-$(git rev-parse --short=12 HEAD)" > /dev/null

  - name: Build & Push Container Image
    when:
      branch: main
    steps:
      - withCredentials:
          - registryPush
      - sh: |
          IMAGE_TAG="sha-$(git rev-parse --short=12 HEAD)"
          docker build -f apps/server/Dockerfile -t "${IMAGE_REPOSITORY}:${IMAGE_TAG}" .
          docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

  - name: Deploy Staging
    when:
      branch: main
    steps:
      - withCredentials:
          - kubeconfigStaging
      - sh: |
          IMAGE_TAG="sha-$(git rev-parse --short=12 HEAD)"
          helm upgrade --install "${HELM_RELEASE_NAME}" "${HELM_CHART_PATH}" \
            --namespace "${STAGING_NAMESPACE}" \
            --create-namespace \
            -f "${HELM_CHART_PATH}/values-staging.yaml" \
            --set "image.repository=${IMAGE_REPOSITORY}" \
            --set "image.tag=${IMAGE_TAG}" \
            --atomic \
            --wait \
            --timeout 5m

  - name: Production Approval
    when:
      branch: main
      parameter: DEPLOY_TO_PRODUCTION=true
    approval:
      message: 'Approve production Helm rollout of Coaching Catalyst?'
      ok: 'Deploy to Production'

  - name: Deploy Production
    when:
      branch: main
      parameter: DEPLOY_TO_PRODUCTION=true
    steps:
      - withCredentials:
          - kubeconfigProd
      - sh: |
          IMAGE_TAG="sha-$(git rev-parse --short=12 HEAD)"
          helm upgrade --install "${HELM_RELEASE_NAME}" "${HELM_CHART_PATH}" \
            --namespace "${PROD_NAMESPACE}" \
            --create-namespace \
            -f "${HELM_CHART_PATH}/values-prod.yaml" \
            --set "image.repository=${IMAGE_REPOSITORY}" \
            --set "image.tag=${IMAGE_TAG}" \
            --atomic \
            --wait \
            --timeout 5m

post:
  always:
    - archiveArtifacts: 'docs/architecture/domain-model.md,docs/architecture/lifecycles.md'
    - cleanWorkspace: true
