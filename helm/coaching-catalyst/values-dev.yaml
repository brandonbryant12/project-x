# Dev overlay for downstream forks (auto-deployed from main).
replicaCount: 1

podDisruptionBudget:
  enabled: false

datadog:
  enabled: true
  env: dev
  useNodeAgentOtlp: true

ingress:
  enabled: true
  hosts:
    - host: coaching-dev.firm.example
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: coaching-catalyst-dev-tls
      hosts:
        - coaching-dev.firm.example

secrets:
  existingSecret: coaching-catalyst-dev-secrets
  externalSecret:
    enabled: false
    vaultPath: coaching-catalyst/dev

config:
  appOrigin: https://coaching-dev.firm.example
  authMode: entra
  decisions:
    mode: mock
  telemetry:
    enabled: 'true'
    otlpProtocol: protobuf
    metricsTemporality: delta
    environment: dev
  logLevel: debug
  notify:
    transport: log
