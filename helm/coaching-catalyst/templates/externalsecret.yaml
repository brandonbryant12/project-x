{{- if .Values.secrets.externalSecret.enabled -}}
apiVersion: {{ .Values.secrets.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "coaching-catalyst.fullname" . }}
  labels:
    {{- include "coaching-catalyst.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "coaching-catalyst.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.externalSecret.requiredKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.secrets.externalSecret.vaultPath }}
        property: {{ . }}
    {{- end }}
    {{- range .Values.secrets.externalSecret.optionalKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.secrets.externalSecret.vaultPath }}
        property: {{ . }}
    {{- end }}
{{- end }}
