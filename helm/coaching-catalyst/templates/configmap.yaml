apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coaching-catalyst.fullname" . }}
  labels:
    {{- include "coaching-catalyst.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  APP_ORIGIN: {{ .Values.config.appOrigin | quote }}
  DB_MIGRATE_ON_START: {{ .Values.config.dbMigrateOnStart | quote }}
  AUTH_MODE: {{ .Values.config.authMode | quote }}
  {{- if .Values.config.entra.tenantId }}
  ENTRA_TENANT_ID: {{ .Values.config.entra.tenantId | quote }}
  {{- end }}
  {{- if .Values.config.entra.clientId }}
  ENTRA_CLIENT_ID: {{ .Values.config.entra.clientId | quote }}
  {{- end }}
  DECISIONS_MODE: {{ .Values.config.decisions.mode | quote }}
  DECISIONS_PAID_TIER_CONFIRMED: {{ .Values.config.decisions.paidTierConfirmed | quote }}
  TELEMETRY_ENABLED: {{ .Values.config.telemetry.enabled | quote }}
  {{- if .Values.config.telemetry.otlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.telemetry.otlpEndpoint | quote }}
  {{- end }}
  {{- if .Values.config.telemetry.otlpTracesEndpoint }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.config.telemetry.otlpTracesEndpoint | quote }}
  {{- end }}
  {{- if .Values.config.telemetry.otlpMetricsEndpoint }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: {{ .Values.config.telemetry.otlpMetricsEndpoint | quote }}
  {{- end }}
  {{- if .Values.config.telemetry.otlpLogsEndpoint }}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: {{ .Values.config.telemetry.otlpLogsEndpoint | quote }}
  {{- end }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.config.telemetry.otlpProtocol | quote }}
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY: {{ .Values.config.telemetry.metricsTemporality | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.telemetry.serviceName | quote }}
  OTEL_SERVICE_VERSION: {{ .Values.config.telemetry.serviceVersion | default (include "coaching-catalyst.version" .) | quote }}
  OTEL_ENV: {{ .Values.config.telemetry.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  SCHEDULER_ENABLED: {{ .Values.config.schedulerEnabled | quote }}
  NOTIFY_TRANSPORT: {{ .Values.config.notify.transport | quote }}
  {{- if .Values.config.notify.smtpHost }}
  SMTP_HOST: {{ .Values.config.notify.smtpHost | quote }}
  {{- end }}
  SMTP_PORT: {{ .Values.config.notify.smtpPort | quote }}
  SMTP_SECURE: {{ .Values.config.notify.smtpSecure | quote }}
  {{- if .Values.config.notify.smtpUser }}
  SMTP_USER: {{ .Values.config.notify.smtpUser | quote }}
  {{- end }}
  {{- if .Values.config.notify.from }}
  NOTIFY_FROM: {{ .Values.config.notify.from | quote }}
  {{- end }}
  FEATURE_DESIGNATED_OBSERVERS: {{ .Values.config.features.designatedObservers | quote }}
