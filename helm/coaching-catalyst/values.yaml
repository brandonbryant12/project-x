# Default production-safe values for coaching-catalyst.
# Downstream forks should keep this file as the clean baseline and layer
# environment overrides in values-staging.yaml / values-prod.yaml.
#
# IMPORTANT: Never place real secrets in values*.yaml.
# See ../README.md for the Vault secrets matrix.

replicaCount: 2

image:
  repository: ghcr.io/your-org/coaching-catalyst
  tag: '' # Defaults to Chart.appVersion; override with immutable git SHA in CD
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ''

# Pod annotations (e.g., HashiCorp Vault Agent Injector or Datadog autodiscovery).
podAnnotations: {}

# Optional HashiCorp Vault Agent Injector snippet (alternative to ExternalSecret):
# podAnnotations:
#   vault.hashicorp.com/agent-inject: "true"
#   vault.hashicorp.com/role: "coaching-catalyst"
#   vault.hashicorp.com/agent-inject-secret-env: "secret/data/coaching-catalyst/prod"

podLabels: {}

# Datadog Unified Service Tagging (ADR 0013).
datadog:
  enabled: false
  service: coaching-catalyst
  env: production
  version: '' # Defaults to image.tag or Chart.appVersion
  # When true, injects DATADOG_HOST_IP via Downward API and derives
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://$(DATADOG_HOST_IP):4318 automatically
  # unless config.telemetry.otlpEndpoint is explicitly set.
  useNodeAgentOtlp: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 4400

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: coaching.firm.example
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: coaching-catalyst-tls
  #    hosts:
  #      - coaching.firm.example

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: '1'
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 24 # Allows up to 2m for DB migrations on cold start

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# ---------------------------------------------------------------------------
# Secrets wiring (Vault-backed)
# ---------------------------------------------------------------------------
# All sensitive env vars (DATABASE_URL, ENTRA_CLIENT_SECRET, AUTH_FLOW_SECRET,
# optional DECISIONS_API_KEY, SMTP_PASSWORD, OTEL_EXPORTER_OTLP_HEADERS) are
# loaded via `envFrom: secretRef` from a Kubernetes Secret populated by Vault.
secrets:
  # Name of an existing K8s Secret (e.g., created by External Secrets Operator,
  # SealedSecrets, or Vault CSI). Ignored if externalSecret.enabled=true.
  existingSecret: coaching-catalyst-secrets

  # Optional: render an External Secrets Operator (ESO) ExternalSecret resource
  # that syncs keys from HashiCorp Vault into the K8s Secret automatically.
  externalSecret:
    enabled: false
    apiVersion: external-secrets.io/v1beta1
    refreshInterval: 1h
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    # Vault KV v2 path (without `secret/data/` prefix when configured on store).
    vaultPath: coaching-catalyst/prod
    # Keys to pull from Vault. Add optional keys when enabling live AI / SMTP / OTLP headers.
    requiredKeys:
      - DATABASE_URL
      - ENTRA_CLIENT_SECRET
      - AUTH_FLOW_SECRET
    optionalKeys: []
    #  - DECISIONS_API_KEY
    #  - SMTP_PASSWORD
    #  - OTEL_EXPORTER_OTLP_HEADERS

# ---------------------------------------------------------------------------
# Non-secret application configuration (mapped to ConfigMap)
# Matches apps/server/src/platform/config.ts
# ---------------------------------------------------------------------------
config:
  nodeEnv: production
  port: '4400'
  appOrigin: https://coaching.firm.example
  dbMigrateOnStart: 'true'
  authMode: entra # Must be `entra` when NODE_ENV=production
  entra:
    tenantId: ''
    clientId: ''
  decisions:
    mode: disabled # disabled | mock | live (live requires DECISIONS_API_KEY in Vault + paidTierConfirmed=true)
    paidTierConfirmed: 'false'
  telemetry:
    enabled: 'false'
    otlpEndpoint: '' # Leave blank if datadog.enabled=true && datadog.useNodeAgentOtlp=true
    otlpTracesEndpoint: ''
    otlpMetricsEndpoint: ''
    otlpLogsEndpoint: ''
    otlpProtocol: protobuf # json | protobuf (protobuf recommended for Datadog)
    metricsTemporality: delta # delta (Datadog) | cumulative (Prometheus)
    serviceName: coaching-catalyst
    serviceVersion: '' # Defaults to image.tag or Chart.appVersion
    environment: production
  logLevel: info # debug | info | warn | error
  logFormat: json
  schedulerEnabled: 'true'
  notify:
    transport: log # log | smtp
    smtpHost: ''
    smtpPort: '587'
    smtpSecure: 'false'
    smtpUser: ''
    from: ''
  features:
    designatedObservers: 'false'
