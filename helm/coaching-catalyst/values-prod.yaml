# Production overlay example for downstream forks.
replicaCount: 3

datadog:
  enabled: true
  env: prod
  useNodeAgentOtlp: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  hosts:
    - host: coaching.firm.example
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: coaching-catalyst-prod-tls
      hosts:
        - coaching.firm.example

secrets:
  existingSecret: coaching-catalyst-prod-secrets
  externalSecret:
    enabled: false
    vaultPath: coaching-catalyst/prod
    optionalKeys:
      - DECISIONS_API_KEY
      - SMTP_PASSWORD

config:
  appOrigin: https://coaching.firm.example
  authMode: entra
  decisions:
    mode: live
    paidTierConfirmed: 'true'
  telemetry:
    enabled: 'true'
    otlpProtocol: protobuf
    metricsTemporality: delta
    environment: prod
  logLevel: info
  notify:
    transport: smtp
    smtpPort: '587'
    smtpSecure: 'false'
