name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Zero lint warnings (docs/archive/reviews/2026-11-16-path-to-a.md). `pnpm check`
  # runs it too; this job names the failure on its own.
  lint-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:strict

  # Every cited path and relative link resolves, banned terms are absent and
  # the ADR index matches the directory; the feature map cites only what exists
  # and claims every route, endpoint and scenario test (tools/verify, no install).
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/docs-check.mjs
      - run: node tools/verify/cli.mjs check

  # The Postgres lane (docs/testing/strategy.md): integrity and scenario suites
  # on real PostgreSQL 18. Each suite creates and drops its own database.
  test-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg

  # Build the production image, start it against Postgres and wait for
  # /readyz (migrations applied, database answering). Entra sign-in discovers
  # its issuer at startup, so the smoke runs the image with dev auth and
  # NODE_ENV=development; everything else is the shipped image.
  build-image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t app:ci .
      - name: Smoke the image
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=app \
            postgres:18-alpine
          for i in $(seq 1 30); do
            docker exec smoke-db pg_isready -U app -d app && break
            sleep 2
          done
          docker run -d --name smoke-app --network smoke -p 4400:4400 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e NODE_ENV=development -e AUTH_MODE=dev -e DECISIONS_MODE=disabled \
            -e APP_ORIGIN=http://localhost:4400 \
            -e DATABASE_URL=postgres://app:app@smoke-db:5432/app -e DB_MIGRATE_ON_START=true \
            app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4400/readyz; then
              curl -fsS -o /dev/null http://127.0.0.1:4400/
              exit 0
            fi
            sleep 2
          done
          docker logs smoke-app
          exit 1
